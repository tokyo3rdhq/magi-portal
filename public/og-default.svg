<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="300" fill="#0ea5e9" opacity="0.1"/>
  <circle cx="1000" cy="480" r="350" fill="#8b5cf6" opacity="0.1"/>
  
  <!-- Logo -->
  <circle cx="600" cy="200" r="60" fill="url(#accent)"/>
  <text x="600" y="225" font-size="60" text-anchor="middle" fill="white">🧙</text>
  
  <!-- Title -->
  <text x="600" y="380" font-family="system-ui, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="white">Magi</text>
  <text x="600" y="450" font-family="system-ui, sans-serif" font-size="36" text-anchor="middle" fill="#94a3b8">Personal AI Lab</text>
  
  <!-- URL -->
  <text x="600" y="550" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" fill="#64748b">magi.website</text>
</svg>
