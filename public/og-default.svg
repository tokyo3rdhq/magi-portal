<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1a0f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g stroke="#00ff41" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  
  <!-- Decorative corners -->
  <g stroke="#00ff41" stroke-width="3" fill="none" opacity="0.8">
    <path d="M 20 60 L 20 20 L 60 20"/>
    <path d="M 1140 20 L 1180 20 L 1180 60"/>
    <path d="M 1180 570 L 1180 610 L 1140 610"/>
    <path d="M 60 610 L 20 610 L 20 570"/>
  </g>
  
  <!-- MAGI Text -->
  <text x="600" y="280" font-family="monospace" font-size="120" font-weight="bold" text-anchor="middle" fill="#00ff41" style="filter: drop-shadow(0 0 20px #00ff41);">MAGI</text>
  
  <!-- Subtitle -->
  <text x="600" y="340" font-family="monospace" font-size="32" text-anchor="middle" fill="#00ff41" opacity="0.7">.website</text>
  
  <!-- Tagline -->
  <text x="600" y="420" font-family="monospace" font-size="24" text-anchor="middle" fill="#00ffff">
    PERSONAL AI LAB // INDEPENDENT DEVELOPER
  </text>
  
  <!-- Status indicators -->
  <circle cx="300" cy="520" r="8" fill="#00ff41">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="320" y="525" font-family="monospace" font-size="16" fill="#00ff41" opacity="0.8">SYSTEM_ONLINE</text>
  
  <circle cx="600" cy="520" r="8" fill="#ff00ff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <text x="620" y="525" font-family="monospace" font-size="16" fill="#ff00ff" opacity="0.8">MELCHIOR_ACTIVE</text>
  
  <circle cx="900" cy="520" r="8" fill="#00ffff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <text x="920" y="525" font-family="monospace" font-size="16" fill="#00ffff" opacity="0.8">CLOUDFLARE_EDGE</text>
  
  <!-- Corner decorations -->
  <circle cx="150" cy="150" r="60" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="150" r="80" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.1"/>
  
  <circle cx="1050" cy="480" r="60" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="480" r="80" fill="none" stroke="#00ff41" stroke-width="0.5" opacity="0.1"/>
</svg>
